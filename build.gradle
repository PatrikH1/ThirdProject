plugins {
    id 'java'

    // Apply the application plugin to add support for building a CLI application.
    id 'application'
}


repositories {
    mavenCentral()
}

dependencies {
    implementation 'junit:junit:4.13.1'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.12'
}

test {
    useJUnit()
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

application {
    // Define the main class for the application.
    // mainClassName = 'HelloWorld.Class1'
    // mainClassName = 'vinstSkatt.BeraknaVinstSkattMain'
    // mainClassName = 'guiFirstTest.NewJFrameTestMultiRandom'
    mainClassName = 'modernCalc.ModernCalcApp'
    // mainClassName = 'PingPong.AskNumberOfMatches'
    // mainClass.set("HelloWorld.Class1")
}

